# Nome do app
spring.application.name=ecomerce-back

# Caminho da conexão
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# Usuário
spring.datasource.username=nicolly
# Senha
spring.datasource.password=Ni123@
# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ativa a criação das tabelas
spring.jpa.hibernate.ddl-auto=create
# Exibe as SQLs
spring.jpa.show-sql=true

# Formata as SQLs
spring.jpa.properties.hibernate.format_sql=true

# Exibe o dialeto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect